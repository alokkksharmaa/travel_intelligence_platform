[project]
name = "travel-intelligence-platform"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "httpx",
  "pydantic>=2",
  "sqlalchemy>=2",
  "psycopg2-binary",
  "pandas",
  "pyyaml",
  "python-dotenv",
  "fastapi",
  "uvicorn",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "black", "pre-commit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100