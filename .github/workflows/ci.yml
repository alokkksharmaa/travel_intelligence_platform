name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify required directories exist
        run: |
          missing=0
          for p in src tests; do
            if [ ! -d "$p" ]; then
              echo "::error::Missing required directory: $p"
              missing=1
            fi
          done
          exit $missing

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest -q